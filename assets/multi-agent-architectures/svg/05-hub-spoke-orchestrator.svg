    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">W4</text>
    <text class="node-role" y="94">data</text>
  </g>
      <g id="docs" class="agent" transform="translate(1320 760)" opacity="1">
    <circle r="58" fill="#0891b2" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
