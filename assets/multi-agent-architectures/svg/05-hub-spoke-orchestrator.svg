      <path class="edge-soft dash" d="M960 335 C940 415 940 465 947 467" />
      <path class="edge-soft dash" d="M1305 382 C1180 470 1105 530 1033 545" />
      <path class="edge-soft dash" d="M655 728 C740 645 815 590 887 565" />
      <path class="edge-soft dash" d="M1265 728 C1180 645 1105 590 1033 565" />
      <g id="final" class="box">
    <rect class="card" x="820" y="835" width="280" height="105" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="960" y="875.5">Final</text>
    <text class="box-subtitle" x="960" y="915.5">synthesis</text>
  </g>
      <line class="edge" x1="960" y1="623" x2="960" y2="835" />

  </g>
  <g id="footer">
    <text class="footer" x="96" y="1016">Good: bounded decomposition, context isolation, synthesis.</text>
    <text class="footer muted" x="96" y="1048">Bad: lead bottleneck and lost cross-worker detail.</text>
  </g>
</svg>
