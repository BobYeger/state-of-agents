<line class="grid-line" x1="70" y1="840" x2="1850" y2="840"/>
<line class="grid-line" x1="70" y1="960" x2="1850" y2="960"/></g>
  <g id="header">
    <text class="title" x="96" y="104">Hub-and-Spoke</text>
    <text class="subtitle" x="96" y="150">A central orchestrator delegates and synthesizes.</text>
  </g>
  <g id="architecture" data-slug="05-hub-spoke-orchestrator">

      <g id="orchestrator" class="agent" transform="translate(960 545)" opacity="1">
    <circle r="78" fill="#7c3aed" stroke="#111827" stroke-width="3"/>
    <circle r="63" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">O</text>
    <text class="node-role" y="114">orchestrator</text>
  </g>
      <g id="search" class="agent" transform="translate(560 330)" opacity="1">
    <circle r="58" fill="#2563eb" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">W1</text>
    <text class="node-role" y="94">search</text>
  </g>
      <g id="code" class="agent" transform="translate(960 275)" opacity="1">
    <circle r="58" fill="#16a34a" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">W2</text>
    <text class="node-role" y="94">code</text>
  </g>
      <g id="review" class="agent" transform="translate(1360 330)" opacity="1">
    <circle r="58" fill="#d97706" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
