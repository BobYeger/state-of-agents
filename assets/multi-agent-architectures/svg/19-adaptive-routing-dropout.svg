<line class="grid-line" x1="70" y1="960" x2="1850" y2="960"/></g>
  <g id="header">
    <text class="title" x="96" y="104">Adaptive Routing / Dropout</text>
    <text class="subtitle" x="96" y="150">A controller activates only useful agents.</text>
  </g>
  <g id="architecture" data-slug="19-adaptive-routing-dropout">

      <g id="route" class="diamond">
    <polygon points="520,445 610,535 520,625 430,535" fill="#7c3aed" stroke="#111827" stroke-width="3" filter="url(#soft-shadow)"/>
    <text class="node-label" x="520" y="537">Route</text>
  </g>
      <g id="active" class="agent" transform="translate(880 310)" opacity="1">
    <circle r="42" fill="#2563eb" stroke="#111827" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A1</text>
    <text class="node-role" y="78">active</text>
  </g>
      <g id="active" class="agent" transform="translate(1120 310)" opacity="1">
    <circle r="42" fill="#16a34a" stroke="#111827" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A2</text>
    <text class="node-role" y="78">active</text>
  </g>
      <g id="dropped" class="agent" transform="translate(1360 310)" opacity="1">
    <circle r="42" fill="#d97706" stroke="#111827" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
