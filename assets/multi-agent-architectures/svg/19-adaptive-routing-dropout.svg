    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A6</text>
    <text class="node-role" y="78">active</text>
  </g>
      <g class="ghost"><line class="edge-soft dash" x1="520" y1="535" x2="1360" y2="310" /><line class="edge-soft dash" x1="520" y1="535" x2="1120" y2="725" /></g>
      <line class="edge" x1="600" y1="500" x2="838" y2="330" />
      <line class="edge" x1="610" y1="515" x2="1078" y2="330" />
      <line class="edge" x1="600" y1="570" x2="838" y2="705" />
      <line class="edge" x1="610" y1="585" x2="1318" y2="705" />
      <g id="budget" class="box">
    <rect class="card" x="1430" y="490" width="270" height="120" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="1565" y="538">Budget</text>
    <text class="box-subtitle" x="1565" y="578">tokens + latency</text>
  </g>
      <path class="edge-soft" d="M1400 725 C1515 695 1580 630 1600 610" />
      <text class="tiny" x="960" y="905">dropout must be task-aware, not random</text>

  </g>
  <g id="footer">
    <text class="footer" x="96" y="1016">Good: cost-aware routing and pruning redundancy.</text>
    <text class="footer muted" x="96" y="1048">Bad: router errors can hide needed expertise.</text>
  </g>
