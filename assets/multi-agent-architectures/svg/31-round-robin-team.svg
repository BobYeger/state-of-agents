<line class="grid-line" x1="1680" y1="198" x2="1680" y2="990"/>
<line class="grid-line" x1="1800" y1="198" x2="1800" y2="990"/>
<line class="grid-line" x1="70" y1="240" x2="1850" y2="240"/>
<line class="grid-line" x1="70" y1="360" x2="1850" y2="360"/>
<line class="grid-line" x1="70" y1="480" x2="1850" y2="480"/>
<line class="grid-line" x1="70" y1="600" x2="1850" y2="600"/>
<line class="grid-line" x1="70" y1="720" x2="1850" y2="720"/>
<line class="grid-line" x1="70" y1="840" x2="1850" y2="840"/>
<line class="grid-line" x1="70" y1="960" x2="1850" y2="960"/></g>
  <g id="header">
    <text class="title" x="96" y="104">Round-Robin Team</text>
    <text class="subtitle" x="96" y="150">Participants speak in a fixed recurring order.</text>
  </g>
  <g id="architecture" data-slug="31-round-robin-team">

      <ellipse cx="960" cy="545" rx="400" ry="245" fill="#ffffff" stroke="#d0d5dd" stroke-width="4" filter="url(#soft-shadow)"/>
      <g id="turn-1" class="agent" transform="translate(960 285)" opacity="1">
    <circle r="54" fill="#2563eb" stroke="#111827" stroke-width="3"/>
    <circle r="39" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A1</text>
    <text class="node-role" y="90">turn 1</text>
  </g>
      <g id="turn-2" class="agent" transform="translate(1285 435)" opacity="1">
    <circle r="54" fill="#16a34a" stroke="#111827" stroke-width="3"/>
    <circle r="39" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A2</text>
    <text class="node-role" y="90">turn 2</text>
  </g>
      <g id="turn-3" class="agent" transform="translate(1165 735)" opacity="1">
    <circle r="54" fill="#d97706" stroke="#111827" stroke-width="3"/>
    <circle r="39" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A3</text>
    <text class="node-role" y="90">turn 3</text>
  </g>
      <g id="turn-4" class="agent" transform="translate(755 735)" opacity="1">
    <circle r="54" fill="#db2777" stroke="#111827" stroke-width="3"/>
    <circle r="39" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A4</text>
    <text class="node-role" y="90">turn 4</text>
  </g>
      <g id="turn-5" class="agent" transform="translate(635 435)" opacity="1">
    <circle r="54" fill="#0891b2" stroke="#111827" stroke-width="3"/>
    <circle r="39" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A5</text>
    <text class="node-role" y="90">turn 5</text>
  </g>
      <path class="edge" d="M1015 300 C1135 320 1225 365 1260 395" />
      <path class="edge" d="M1280 490 C1255 610 1220 675 1195 705" />
      <path class="edge" d="M1110 760 C980 830 870 815 810 765" />
      <path class="edge" d="M725 695 C650 610 625 525 630 490" />
      <path class="edge" d="M675 395 C740 320 850 290 905 285" />
      <g id="transcript" class="box">
    <rect class="card" x="810" y="495" width="300" height="100" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="960" y="533">Transcript</text>
    <text class="box-subtitle" x="960" y="573">shared context</text>
  </g>
      <circle class="packet" cx="1150" cy="350" r="15" fill="#f59e0b"/>
      <circle class="packet" cx="1265" cy="590" r="15" fill="#f59e0b"/>
      <circle class="packet" cx="940" cy="805" r="15" fill="#f59e0b"/>

  </g>
  <g id="footer">
    <text class="footer" x="96" y="1016">Good: equal turns, predictable review, simple control.</text>
    <text class="footer muted" x="96" y="1048">Bad: error propagation and fixed-order inefficiency.</text>
  </g>
</svg>
