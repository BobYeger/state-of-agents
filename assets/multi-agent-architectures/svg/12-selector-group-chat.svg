<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Selector Group Chat</title>
  <desc id="desc">A speaker selector chooses the next participant.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="13" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,5 L0,10 Z" fill="#475467"/>
    </marker>
    <marker id="arrow-light" markerWidth="18" markerHeight="18" refX="13" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .bg { fill: #f8fafc; }
    .grid-line { stroke: #e5e7eb; stroke-width: 1; opacity: 0.62; }
    .title { fill: #111827; font-size: 64px; font-weight: 820; }
    .subtitle { fill: #667085; font-size: 28px; font-weight: 560; }
    .footer { fill: #344054; font-size: 22px; font-weight: 650; }
    .muted { fill: #667085; }
    .node-label { fill: #ffffff; font-size: 30px; font-weight: 820; text-anchor: middle; dominant-baseline: middle; }
    .node-role { fill: #344054; font-size: 23px; font-weight: 700; text-anchor: middle; }
    .box-title { fill: #111827; font-size: 28px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    .box-subtitle { fill: #667085; font-size: 20px; font-weight: 650; text-anchor: middle; }
    .tiny { fill: #667085; font-size: 18px; font-weight: 700; text-anchor: middle; }
    .edge { stroke: #667085; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .edge-soft { stroke: #cbd5e1; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-light); }
    .edge-noarrow { stroke: #667085; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .edge-soft-noarrow { stroke: #cbd5e1; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 14 16; }
    .card { fill: #ffffff; stroke: #d0d5dd; stroke-width: 3; filter: url(#soft-shadow); }
    .ghost { opacity: 0.26; }
    .packet { stroke: #ffffff; stroke-width: 3; }
    .ring { fill: none; stroke: #d0d5dd; stroke-width: 3; }
  </style>
  <rect class="bg" width="1920" height="1080"/>
  <g id="grid"><line class="grid-line" x1="120" y1="198" x2="120" y2="990"/>
<line class="grid-line" x1="240" y1="198" x2="240" y2="990"/>
<line class="grid-line" x1="360" y1="198" x2="360" y2="990"/>
<line class="grid-line" x1="480" y1="198" x2="480" y2="990"/>
<line class="grid-line" x1="600" y1="198" x2="600" y2="990"/>
<line class="grid-line" x1="720" y1="198" x2="720" y2="990"/>
<line class="grid-line" x1="840" y1="198" x2="840" y2="990"/>
<line class="grid-line" x1="960" y1="198" x2="960" y2="990"/>
<line class="grid-line" x1="1080" y1="198" x2="1080" y2="990"/>
<line class="grid-line" x1="1200" y1="198" x2="1200" y2="990"/>
<line class="grid-line" x1="1320" y1="198" x2="1320" y2="990"/>
<line class="grid-line" x1="1440" y1="198" x2="1440" y2="990"/>
<line class="grid-line" x1="1560" y1="198" x2="1560" y2="990"/>
<line class="grid-line" x1="1680" y1="198" x2="1680" y2="990"/>
<line class="grid-line" x1="1800" y1="198" x2="1800" y2="990"/>
<line class="grid-line" x1="70" y1="240" x2="1850" y2="240"/>
<line class="grid-line" x1="70" y1="360" x2="1850" y2="360"/>
<line class="grid-line" x1="70" y1="480" x2="1850" y2="480"/>
<line class="grid-line" x1="70" y1="600" x2="1850" y2="600"/>
<line class="grid-line" x1="70" y1="720" x2="1850" y2="720"/>
<line class="grid-line" x1="70" y1="840" x2="1850" y2="840"/>
<line class="grid-line" x1="70" y1="960" x2="1850" y2="960"/></g>
  <g id="header">
    <text class="title" x="96" y="104">Selector Group Chat</text>
    <text class="subtitle" x="96" y="150">A speaker selector chooses the next participant.</text>
  </g>
  <g id="architecture" data-slug="12-selector-group-chat">

      <ellipse cx="960" cy="555" rx="360" ry="210" fill="#ffffff" stroke="#d0d5dd" stroke-width="4" filter="url(#soft-shadow)"/>
      <g id="selector" class="agent" transform="translate(960 310)" opacity="1">
    <circle r="56" fill="#7c3aed" stroke="#111827" stroke-width="3"/>
    <circle r="41" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">S</text>
    <text class="node-role" y="92">selector</text>
  </g>
      <g id="analyst" class="agent" transform="translate(650 480)" opacity="1">
    <circle r="42" fill="#2563eb" stroke="#111827" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A1</text>
    <text class="node-role" y="78">analyst</text>
  </g>
      <g id="coder" class="agent" transform="translate(820 720)" opacity="1">
    <circle r="42" fill="#16a34a" stroke="#111827" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A2</text>
    <text class="node-role" y="78">coder</text>
  </g>
      <g id="critic" class="agent" transform="translate(1100 720)" opacity="1">
    <circle r="42" fill="#d97706" stroke="#111827" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A3</text>
    <text class="node-role" y="78">critic</text>
  </g>
      <g id="research" class="agent" transform="translate(1270 480)" opacity="1">
    <circle r="42" fill="#db2777" stroke="#111827" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">A4</text>
    <text class="node-role" y="78">research</text>
  </g>
      <path class="edge-soft dash" d="M960 365 C850 390 760 420 690 455" />
      <path class="edge-soft dash" d="M960 365 C1070 390 1160 420 1230 455" />
      <path class="edge-soft-noarrow" d="M690 510 C780 620 930 660 1060 700" />
      <path class="edge-soft-noarrow" d="M1230 510 C1140 620 990 660 860 700" />
      <circle class="packet" cx="960" cy="555" r="18" fill="#f59e0b"/>
      <text class="tiny" x="960" y="565">shared transcript</text>

  </g>
  <g id="footer">
    <text class="footer" x="96" y="1016">Good: shared-context collaboration and dynamic turns.</text>
    <text class="footer muted" x="96" y="1048">Bad: runaway discussion and context pollution.</text>
  </g>
</svg>
