<line class="grid-line" x1="70" y1="840" x2="1850" y2="840"/>
<line class="grid-line" x1="70" y1="960" x2="1850" y2="960"/></g>
  <g id="header">
    <text class="title" x="96" y="104">Role-Based SOP Team</text>
    <text class="subtitle" x="96" y="150">Specialists pass structured artifacts through phases.</text>
  </g>
  <g id="architecture" data-slug="32-role-sop-team">

      <g id="requirements" class="agent" transform="translate(330 455)" opacity="1">
    <circle r="58" fill="#7c3aed" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">PM</text>
    <text class="node-role" y="94">requirements</text>
  </g>
      <g id="architecture" class="agent" transform="translate(630 455)" opacity="1">
    <circle r="58" fill="#2563eb" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">AR</text>
    <text class="node-role" y="94">architecture</text>
  </g>
      <g id="development" class="agent" transform="translate(930 455)" opacity="1">
    <circle r="58" fill="#16a34a" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">DE</text>
    <text class="node-role" y="94">development</text>
  </g>
      <g id="testing" class="agent" transform="translate(1230 455)" opacity="1">
    <circle r="58" fill="#d97706" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">QA</text>
    <text class="node-role" y="94">testing</text>
  </g>
      <g id="docs" class="agent" transform="translate(1530 455)" opacity="1">
    <circle r="58" fill="#db2777" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">DO</text>
    <text class="node-role" y="94">docs</text>
  </g>
      <g id="prd" class="box">
    <rect class="card" x="230" y="705" width="200" height="95" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="330" y="752.5">PRD</text>

  </g>
      <g id="design" class="box">
    <rect class="card" x="530" y="705" width="200" height="95" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="630" y="752.5">Design</text>

  </g>
      <g id="code" class="box">
    <rect class="card" x="830" y="705" width="200" height="95" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="930" y="752.5">Code</text>

  </g>
      <g id="tests" class="box">
    <rect class="card" x="1130" y="705" width="200" height="95" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="1230" y="752.5">Tests</text>

  </g>
      <g id="manual" class="box">
    <rect class="card" x="1430" y="705" width="200" height="95" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="1530" y="752.5">Manual</text>

  </g>
      <line class="edge" x1="388" y1="455" x2="572" y2="455" />
      <line class="edge" x1="688" y1="455" x2="872" y2="455" />
      <line class="edge" x1="988" y1="455" x2="1172" y2="455" />
      <line class="edge" x1="1288" y1="455" x2="1472" y2="455" />
      <line class="edge" x1="330" y1="513" x2="330" y2="705" />
      <line class="edge" x1="630" y1="513" x2="630" y2="705" />
      <line class="edge" x1="930" y1="513" x2="930" y2="705" />
      <line class="edge" x1="1230" y1="513" x2="1230" y2="705" />
      <line class="edge" x1="1530" y1="513" x2="1530" y2="705" />
      <path class="edge-soft dash" d="M1230 705 C1110 620 1000 585 930 513" />
      <text class="tiny" x="960" y="880">structured artifacts constrain the conversation</text>

  </g>
  <g id="footer">
    <text class="footer" x="96" y="1016">Good: greenfield prototypes and phaseable software work.</text>
    <text class="footer muted" x="96" y="1048">Bad: rigid roles, fake expertise, weak repo operations.</text>
  </g>
