<line class="grid-line" x1="1680" y1="198" x2="1680" y2="990"/>
<line class="grid-line" x1="1800" y1="198" x2="1800" y2="990"/>
<line class="grid-line" x1="70" y1="240" x2="1850" y2="240"/>
<line class="grid-line" x1="70" y1="360" x2="1850" y2="360"/>
<line class="grid-line" x1="70" y1="480" x2="1850" y2="480"/>
<line class="grid-line" x1="70" y1="600" x2="1850" y2="600"/>
<line class="grid-line" x1="70" y1="720" x2="1850" y2="720"/>
<line class="grid-line" x1="70" y1="840" x2="1850" y2="840"/>
<line class="grid-line" x1="70" y1="960" x2="1850" y2="960"/></g>
  <g id="header">
    <text class="title" x="96" y="104">Planner-Executor-Verifier</text>
    <text class="subtitle" x="96" y="150">A verifier can reject work and force repair.</text>
  </g>
  <g id="architecture" data-slug="09-planner-executor-verifier">

      <g id="planner" class="agent" transform="translate(420 520)" opacity="1">
    <circle r="58" fill="#7c3aed" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">P</text>
    <text class="node-role" y="94">planner</text>
  </g>
      <g id="executor" class="agent" transform="translate(820 520)" opacity="1">
    <circle r="58" fill="#16a34a" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">E</text>
    <text class="node-role" y="94">executor</text>
  </g>
      <g id="verifier" class="agent" transform="translate(1220 520)" opacity="1">
    <circle r="58" fill="#d97706" stroke="#111827" stroke-width="3"/>
    <circle r="43" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <text class="node-label" y="2">V</text>
    <text class="node-role" y="94">verifier</text>
  </g>
      <g id="release" class="box">
    <rect class="card" x="1530" y="460" width="260" height="120" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text class="box-title" x="1660" y="508">Release</text>
    <text class="box-subtitle" x="1660" y="548">accepted</text>
  </g>
      <line class="edge" x1="478" y1="520" x2="762" y2="520" />
      <line class="edge" x1="878" y1="520" x2="1162" y2="520" />
      <line class="edge" x1="1278" y1="520" x2="1530" y2="520" />
      <path class="edge-soft dash" d="M1235 460 C1160 300 800 285 455 470" />
      <path class="edge-soft dash" d="M1245 585 C1140 750 850 760 505 590" />
      <circle class="packet" cx="620" cy="520" r="15" fill="#7c3aed"/>
      <circle class="packet" cx="1025" cy="520" r="15" fill="#16a34a"/>
      <circle class="packet" cx="950" cy="728" r="15" fill="#dc2626"/>
      <text class="tiny" x="960" y="835">reject path carries evidence, tests, or rubric feedback</text>

  </g>
  <g id="footer">
    <text class="footer" x="96" y="1016">Good: checkable handoffs, tests, repair loops.</text>
    <text class="footer muted" x="96" y="1048">Bad: weak rubrics, verifier bottlenecks, bad feedback.</text>
  </g>
</svg>
